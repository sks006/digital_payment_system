name: Update Pyth Price Feeds on Devnet

on:
  schedule:
    # Run every 10 minutes to keep devnet oracle accounts fresh
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  update-feeds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies (auto-detect)
        working-directory: apps/web
        run: |
          set -e
          cd apps/web
          if [ -f yarn.lock ]; then
            echo "Detected yarn.lock — using yarn"
            corepack enable
            corepack prepare yarn@stable --activate
            yarn install --frozen-lockfile
          elif [ -f package-lock.json ]; then
            echo "Detected package-lock.json — using npm ci"
            npm ci
          else
            echo "No lockfile found — running npm install"
            npm install
          fi

      - name: Configure Solana Payer Key
        run: |
          mkdir -p ~/.config/solana
          echo "${{ secrets.SOLANA_PAYER_KEY }}" > ~/.config/solana/id.json
          chmod 600 ~/.config/solana/id.json

      - name: Run post-prices
        run: |
          cd apps/web
          npx tsx post-prices.mjs

      - name: Run post-eur
        run: |
          cd apps/web
          npx tsx post-eur.mjs